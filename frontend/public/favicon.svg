<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The NEXUS mark. Four nodes at the corners of a square, joined by the path
    bottom-left -> top-left -> bottom-right -> top-right: that polyline is the
    letter N, and with its vertices drawn it is also a four-node graph.

    currentColor is not available in a favicon, so the two themes are handled by
    a media query inside the file. Browsers that support SVG favicons support
    this; the rest fall back to the light fill.
  -->
  <style>
    .ink { stroke: #0b0b0d; fill: #0b0b0d; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #f7f7f8; fill: #f7f7f8; }
    }
  </style>
  <g class="ink">
    <path d="M8 24 L8 8 L24 24 L24 8" fill="none" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="8" cy="8" r="3.2" stroke="none" />
    <circle cx="8" cy="24" r="3.2" stroke="none" />
    <circle cx="24" cy="8" r="3.2" stroke="none" />
    <circle cx="24" cy="24" r="3.2" stroke="none" />
  </g>
</svg>
